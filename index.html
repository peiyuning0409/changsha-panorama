<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长沙 · 吉首 高清卫星全景</title>
<link rel="stylesheet" href="leaflet/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#map{width:100%;height:100%;font-family:'Microsoft YaHei',sans-serif}
.leaflet-tile{image-rendering:crisp-edges}
.leaflet-container{background:#000}
#panel{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
.btn:hover{background:rgba(255,150,0,.5)}
.btn.hl{background:rgba(255,100,0,.5);border-color:rgba(255,150,50,.7)}
.btn.js{background:rgba(0,150,80,.4);border-color:rgba(0,200,120,.5)}
#info{position:absolute;bottom:24px;left:24px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;z-index:1000;line-height:1.7}
#coords{position:absolute;bottom:24px;right:24px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);color:#aaa;padding:6px 12px;border-radius:6px;font-size:11px;z-index:1000;font-family:monospace}
#zoom{position:absolute;top:50%;right:14px;transform:translateY(-50%);z-index:1000;display:flex;flex-direction:column;gap:6px}
.zb{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.2);cursor:pointer;font-size:18px;line-height:32px;text-align:center}
.zb:hover{background:rgba(0,180,255,.4)}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
<button class="btn hl" onclick="goCS()">长沙市</button>
<button class="btn hl" onclick="goJS()">吉首市</button>
<button class="btn" onclick="go(28.1947,112.9433,17)">岳麓山</button>
<button class="btn" onclick="go(28.1731,112.9550,18)">橘子洲</button>
<button class="btn" onclick="go(28.1960,112.9770,17)">五一广场</button>
<button class="btn" onclick="go(28.1940,113.0130,16)">火车站</button>
<button class="btn" onclick="go(28.1887,112.9765,18)">天心阁</button>
<button class="btn" onclick="go(28.1930,112.8920,17)">梅溪湖</button>
<button class="btn js" onclick="go(28.2550,109.7000,17)">乾州古城</button>
<button class="btn js" onclick="go(28.2980,109.7220,17)">峒河公园</button>
<button class="btn js" onclick="go(28.2530,109.7060,18)">德城园</button>
<button class="btn hl" onclick="go(28.1548,112.9950,18)">凯德广场</button>
</div>
<div id="info"><b>长沙 · 吉首 高清卫星全景</b><br>高德卫星 超清 18级</div>
<div id="coords">--</div>
<div id="zoom">
<button class="zb" onclick="map.zoomIn()">+</button>
<button class="zb" onclick="map.zoomOut()">−</button>
</div>
<script src="leaflet/leaflet.js"></script>
<script>
var map=L.map('map',{zoomControl:false,minZoom:10,maxZoom:18}).setView([28.2282,112.9388],16);
map.attributionControl.setPrefix('');

L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{
  maxZoom:18,
  minZoom:10,
  subdomains:'1234',
  tileSize:256
}).addTo(map);

// 地点标记
var spots=[
  {name:'岳麓山',lat:28.1947,lng:112.9433,color:'#ff6b35'},
  {name:'橘子洲',lat:28.1731,lng:112.9550,color:'#ff6b35'},
  {name:'五一广场',lat:28.1960,lng:112.9770,color:'#ff6b35'},
  {name:'火车站',lat:28.1940,lng:113.0130,color:'#ff6b35'},
  {name:'天心阁',lat:28.1887,lng:112.9765,color:'#ff6b35'},
  {name:'梅溪湖',lat:28.1930,lng:112.8920,color:'#ff6b35'},
  {name:'凯德广场',lat:28.1548,lng:112.9950,color:'#ffaa00'},
  {name:'乾州古城',lat:28.2550,lng:109.7000,color:'#00c878'},
  {name:'峒河公园',lat:28.2980,lng:109.7220,color:'#00c878'},
  {name:'德城园',lat:28.2530,lng:109.7060,color:'#00c878'}
];

spots.forEach(function(s){
  L.circleMarker([s.lat,s.lng],{
    radius:7,fillColor:s.color,fillOpacity:0.9,color:'#fff',weight:2,opacity:1
  }).addTo(map).bindTooltip(s.name,{permanent:true,direction:'right',offset:[8,0],className:'marker-label'});

  L.circleMarker([s.lat,s.lng],{
    radius:3,fillColor:'#fff',fillOpacity:1,color:'transparent',weight:0
  }).addTo(map);
});

// 标签样式
var style=document.createElement('style');
style.textContent='.marker-label{background:rgba(0,0,0,.85)!important;border:1px solid rgba(255,255,255,.3)!important;color:#fff!important;border-radius:6px!important;padding:2px 8px!important;font-size:12px!important;font-family:"Microsoft YaHei",sans-serif!important;white-space:nowrap!important;box-shadow:0 2px 8px rgba(0,0,0,.5)!important}.marker-label::before{border-right-color:rgba(0,0,0,.85)!important;}';
document.head.appendChild(style);

// 坐标显示
map.on('mousemove',function(e){
  document.getElementById('coords').textContent=
    e.latlng.lat.toFixed(5)+'°N '+e.latlng.lng.toFixed(5)+'°E | Z'+map.getZoom();
});

function go(lat,lng,zoom){
  map.flyTo([lat,lng],zoom||16,{duration:1.2});
  setTimeout(function(){
    document.getElementById('info').innerHTML='<b>长沙 · 吉首 高清卫星全景</b><br>高德卫星 · '+lng.toFixed(4)+'°E '+lat.toFixed(4)+'°N';
  },1500);
}
function goCS(){go(28.2282,112.9388,16);}
function goJS(){go(28.2624,109.6981,16);}
</script>
</body>
</html>
